# yaml-language-server: $schema=https://github.com/dfinity/icp-cli/raw/refs/tags/v1.3.0/docs/schemas/canister-yaml-schema.json

# Official pre-built ICRC-1/ICRC-2 ledger canister from dfinity/ic
# (release ledger-suite-icrc-2026-03-09), instead of reimplementing token
# mechanics (see the "icrc-ledger" ICP skill).
#
# NOTE: icrc1_ledger_init.args is GENERATED by scripts/deploy-local.sh /
# scripts/deploy-mainnet.sh from icrc1_ledger_init.args.template, because the
# minting_account must be the "mother" canister's principal, which is only
# known after `icp canister create mother` runs. Do not hand-edit it.
name: ledger
recipe:
  type: "@dfinity/prebuilt@v2.1.0"
  configuration:
    path: ic-icrc1-ledger.wasm
    sha256: a273d741019b4324b22e2e64cfb0239de148ae9693e8801102a04118dfd383c0
    compress: true
init_args:
  path: icrc1_ledger_init.args
  format: candid
